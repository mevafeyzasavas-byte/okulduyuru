name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Build APK (debug, unsigned-key auto-signed by Cordova)
        run: cordova build android --debug

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find platforms/android -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          cp "$APK_PATH" okulduyuru.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: okulduyuru-apk
          path: okulduyuru.apk

      - name: Create/Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Okul Duyuru - Son Sürüm
          body: Otomatik olarak GitHub Actions ile derlendi.
          files: okulduyuru.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
