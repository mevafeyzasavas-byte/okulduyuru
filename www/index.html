<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Duyuru ve Haber Panosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7F2;
    --panel:#FFFFFF;
    --ink:#1C2321;
    --muted:#726B62;
    --hairline:#E4DFD6;
    --accent:#B32026;
    --radius:3px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
  }

  .view{
    width:100%;
    min-height:100vh;
    display:none;
  }

  .view.active{ display:block; }

  /* ---- home ---- */

  #home.active{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .wrap{
    width:100%;
    max-width:520px;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:28px;
    margin-bottom:20px;
  }

  .panel-head{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
  }

  .mono{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border:1px solid var(--ink);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
  }

  .school-name{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    line-height:1.3;
    margin:0;
  }

  .btn{
    width:100%;
    appearance:none;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    padding:13px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }

  .btn:hover, .btn:focus-visible{
    background:var(--ink);
    color:var(--paper);
    outline:none;
  }

  .btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---- detail / article top bar ---- */

  .detail-bar{
    position:sticky;
    top:0;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--hairline);
    z-index:5;
  }

  .back-btn{
    appearance:none;
    border:1px solid var(--hairline);
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    flex:0 0 auto;
  }

  .back-btn:hover{ background:var(--hairline); }

  .detail-school{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .detail-body{
    max-width:640px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  .section{
    margin-bottom:32px;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }

  .section-title{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:500;
    margin:0;
  }

  .section-head a{
    font-size:12px;
    color:var(--muted);
    text-decoration:none;
    white-space:nowrap;
  }

  .section-head a:hover{ color:var(--ink); }

  .item-list{
    list-style:none;
    margin:0;
    padding:0;
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    background:var(--panel);
    overflow:hidden;
  }

  .item-list li{
    border-bottom:1px solid var(--hairline);
  }

  .item-list li:last-child{ border-bottom:0; }

  .item-list a{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:13px 16px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    line-height:1.4;
  }

  .item-list a:hover{ background:var(--paper); }

  .item-title{ flex:1 1 auto; }

  .item-date{
    flex:0 0 auto;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  .status{
    padding:16px;
    font-size:13.5px;
    color:var(--muted);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    background:var(--panel);
  }

  .fallback-frame{
    width:100%;
    height:60vh;
    border:1px solid var(--hairline);
    border-radius:var(--radius);
  }

  /* ---- article view ---- */

  #article .detail-bar{ gap:10px; }

  .article-title{
    font-family:'Fraunces',serif;
    font-size:15px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
  }

  .article-openlink{
    flex:0 0 auto;
    font-size:12px;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--hairline);
    padding:9px 12px;
    border-radius:var(--radius);
    white-space:nowrap;
  }

  .article-openlink:hover{ background:var(--hairline); color:var(--ink); }

  .article-note{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--hairline);
  }

  .article-note a{ color:var(--ink); }

  .article-frame{
    display:block;
    width:100%;
    height:calc(100vh - 84px);
    border:0;
  }
</style>
</head>
<body>

<div class="view active" id="home">
  <div class="wrap">

    <div class="panel">
      <div class="panel-head">
        <div class="mono">AT</div>
        <p class="school-name">Aliye-Hüseyin Tekbaş İlkokulu</p>
      </div>
      <button class="btn" type="button" data-school="ahti">Duyurular ve Haberler</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="mono">UH</div>
        <p class="school-name">Ulubatlı Hasan İmam Hatip Ortaokulu</p>
      </div>
      <button class="btn" type="button" data-school="uhio">Duyurular ve Haberler</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="mono">MEB</div>
        <p class="school-name">Millî Eğitim Bakanlığı</p>
      </div>
      <button class="btn" type="button" data-school="meb">Duyurular ve Haberler</button>
    </div>

  </div>
</div>

<div class="view" id="detail">
  <div class="detail-bar">
    <button class="back-btn" id="backBtn" type="button">&larr; Ana Sayfa</button>
    <div class="detail-school" id="detailSchool"></div>
  </div>
  <div class="detail-body">

    <div class="section">
      <div class="section-head">
        <p class="section-title">Haberler</p>
        <a id="haberlerSiteLink" href="#" target="_blank" rel="noopener">sitede gör</a>
      </div>
      <div id="haberlerBox"><div class="status">Yükleniyor…</div></div>
    </div>

    <div class="section">
      <div class="section-head">
        <p class="section-title">Duyurular</p>
        <a id="duyurularSiteLink" href="#" target="_blank" rel="noopener">sitede gör</a>
      </div>
      <div id="duyurularBox"><div class="status">Yükleniyor…</div></div>
    </div>

  </div>
</div>

<div class="view" id="article">
  <div class="detail-bar">
    <button class="back-btn" id="articleBackBtn" type="button">&larr; Geri</button>
    <div class="article-title" id="articleTitle"></div>
    <a class="article-openlink" id="articleOpenLink" href="#" target="_blank" rel="noopener">Sitede aç</a>
  </div>
  <div class="article-note">Sayfa burada görünmüyorsa <a id="articleNoteLink" href="#" target="_blank" rel="noopener">sitede aç</a>.</div>
  <iframe class="article-frame" id="articleFrame" src="about:blank"></iframe>
</div>

<script>
  var SCHOOLS = {
    ahti: {
      name: "Aliye-Hüseyin Tekbaş İlkokulu",
      duyurular: "https://aliyehuseyintekbasio.meb.k12.tr/icerikler/icerikler/listele_613050_Duyurular",
      haberler: "https://aliyehuseyintekbasio.meb.k12.tr/icerikler/icerikler/listele_613049_Haberler"
    },
    uhio: {
      name: "Ulubatlı Hasan İmam Hatip Ortaokulu",
      duyurular: "https://ulubatlihasaniho.meb.k12.tr/icerikler/icerikler/listele_392275_Duyurular",
      haberler: "https://ulubatlihasaniho.meb.k12.tr/icerikler/icerikler/listele_392274_Haberler"
    },
    meb: {
      name: "Millî Eğitim Bakanlığı",
      duyurular: "https://meb.gov.tr/meb_duyuruindex.php",
      haberler: "https://meb.gov.tr/meb_haberindex.php?KATEGORI=286",
      // meb.gov.tr detay linkleri /icerikler/ değil /duyuru/ veya /haber/ segmenti içerir,
      // ve bazı duyurular alt alan adlarına (ör. personel.meb.gov.tr) çıkabilir.
      linkPattern: /\/(duyuru|haber)\//,
      originHost: "meb.gov.tr",
      // Asıl liste, sayfanın kendi DataTables AJAX uç noktasından geliyor.
      // DevTools > Network'te bulundu: POST ile çağrılan bu uç nokta,
      // {"data":[{"BASLIK":..,"ISLEMSAAT":"DD/MM/YYYY","LINK":..}], ...} döner.
      // loadList() bu alanlar varsa doğrudan bunu kullanır; reader/regex
      // yolu (ve aşağıdaki excludePattern) sadece bu istek başarısız olursa
      // devreye giren yedek.
      duyurularAjax: "https://www.meb.gov.tr/meb_duyuruindex_ajax.php",
      duyurularKategori: 4,
      // NOT: haber ucu için aynı DevTools kontrolü yapılmadı; kategori
      // değeri eski "?KATEGORI=286" query'sinden tahmin edildi. Haberler
      // listesi boş/yanlış gelirse, meb_haberindex.php sayfasında aynı
      // şekilde Network > Fetch/XHR'dan gerçek uç noktayı ve kategori
      // değerini doğrulayın.
      haberlerAjax: "https://www.meb.gov.tr/meb_haberindex_ajax.php",
      haberlerKategori: 286,
      // Asıl duyuru/haber tablosu sayfada JS/AJAX ile dolduruluyor; ham/reader
      // taramasında tabloya erişemediğimizde extractItems tüm sayfadaki linkleri
      // tarıyor ve footer'daki sabit "duyuru" sayfalarını da yakalıyor. Bilinen
      // bu tür sabit linkleri burada eleyin (yeni bir tane fark ederseniz ekleyin).
      excludePattern: /\/(erisilebilirlik|gizlilik|iletisim|sss)\/|ts-isoiec-27001/
    }
  };

  var homeView = document.getElementById('home');
  var detailView = document.getElementById('detail');
  var articleView = document.getElementById('article');
  var detailSchool = document.getElementById('detailSchool');
  var duyurularBox = document.getElementById('duyurularBox');
  var haberlerBox = document.getElementById('haberlerBox');
  var duyurularSiteLink = document.getElementById('duyurularSiteLink');
  var haberlerSiteLink = document.getElementById('haberlerSiteLink');

  var articleTitle = document.getElementById('articleTitle');
  var articleFrame = document.getElementById('articleFrame');
  var articleOpenLink = document.getElementById('articleOpenLink');
  var articleNoteLink = document.getElementById('articleNoteLink');
  var articleBackBtn = document.getElementById('articleBackBtn');

  document.querySelectorAll('.btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var s = SCHOOLS[btn.getAttribute('data-school')];
      openDetail(s);
    });
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    detailView.classList.remove('active');
    homeView.classList.add('active');
    window.scrollTo(0,0);
  });

  // Article view always goes back to the school's detail (list) page,
  // never straight to the home screen, since it's only reachable from there.
  articleBackBtn.addEventListener('click', function(){
    articleFrame.src = 'about:blank';
    articleView.classList.remove('active');
    detailView.classList.add('active');
    window.scrollTo(0,0);
  });

  function openDetail(s){
    detailSchool.textContent = s.name;
    duyurularSiteLink.href = s.duyurular;
    haberlerSiteLink.href = s.haberler;
    duyurularBox.innerHTML = '<div class="status">Yükleniyor…</div>';
    haberlerBox.innerHTML = '<div class="status">Yükleniyor…</div>';

    homeView.classList.remove('active');
    articleView.classList.remove('active');
    detailView.classList.add('active');
    window.scrollTo(0,0);

    loadList(s.haberler, haberlerBox, s);
    loadList(s.duyurular, duyurularBox, s);
  }

  // Opens an item's own page inside the app (same place) instead of a new tab.
  // A "sitede aç" escape hatch is always shown, since some school sites block
  // being framed and would otherwise leave the panel looking blank.
  function openArticle(item){
    articleTitle.textContent = item.title;
    articleOpenLink.href = item.url;
    articleNoteLink.href = item.url;
    articleFrame.src = item.url;

    detailView.classList.remove('active');
    articleView.classList.add('active');
    window.scrollTo(0,0);
  }

  function fetchWithTimeout(url, ms, fetchOpts){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    var init = Object.assign({}, fetchOpts || {}, { signal: controller.signal });
    return fetch(url, init).finally(function(){ clearTimeout(timer); });
  }

  // meb.gov.tr'nin kendi DataTables AJAX uç noktasını çağırır (bkz. SCHOOLS.meb
  // yorumları). Standart DataTables server-side POST alanlarını + sitenin
  // kendine özgü "kategori" parametresini gönderir ve dönen JSON'daki
  // BASLIK/ISLEMSAAT/LINK alanlarını item listesine çevirir.
  function buildMebAjaxBody(kategori){
    var p = new URLSearchParams();
    p.set('draw', '1');
    p.set('columns[0][data]', 'ISLEMSAAT');
    p.set('columns[0][name]', '');
    p.set('columns[0][searchable]', 'true');
    p.set('columns[0][orderable]', 'true');
    p.set('columns[0][search][value]', '');
    p.set('columns[0][search][regex]', 'false');
    p.set('columns[1][data]', 'BASLIK');
    p.set('columns[1][name]', '');
    p.set('columns[1][searchable]', 'true');
    p.set('columns[1][orderable]', 'true');
    p.set('columns[1][search][value]', '');
    p.set('columns[1][search][regex]', 'false');
    p.set('order[0][column]', '0');
    p.set('order[0][dir]', 'desc');
    p.set('order[0][name]', '');
    p.set('start', '0');
    p.set('length', '25');
    p.set('search[value]', '');
    p.set('search[regex]', 'false');
    p.set('kategori', String(kategori));
    return p;
  }

  function parseMebAjaxResponse(json, ajaxUrl){
    var rows = (json && json.data) || [];
    var items = [];
    rows.forEach(function(row){
      var title = (row.BASLIK || '').replace(/\s+/g,' ').trim();
      var rawLink = row.LINK || '';
      if(!title || !rawLink) return;
      var full;
      // LINK bazen mutlak (https://personel.meb.gov.tr/...), bazen köke göre
      // göreli ("/2026-.../duyuru/41623/") geliyor; ikisi de meb.gov.tr'ye
      // göre çözülüyor.
      try { full = new URL(rawLink, 'https://www.meb.gov.tr/').href; } catch(e){ return; }
      items.push({ title: title, url: full, date: row.ISLEMSAAT || '' });
    });
    return items;
  }

  function fetchMebAjaxList(ajaxUrl, kategori){
    function attempt(targetUrl){
      return fetchWithTimeout(targetUrl, 6000, {
        method: 'POST',
        body: buildMebAjaxBody(kategori)
      }).then(function(res){
        if(!res.ok) throw new Error('meb-ajax-failed');
        return res.json();
      });
    }
    // Önce doğrudan dene; tarayıcıdan çapraz-origin istek CORS'a takılırsa
    // (uç nokta kendi sitesi dışına Access-Control-Allow-Origin vermiyorsa)
    // aynı POST'u corsproxy üzerinden tekrar dener.
    return attempt(ajaxUrl)
      .catch(function(){
        return attempt('https://corsproxy.io/?url=' + encodeURIComponent(ajaxUrl));
      })
      .then(function(json){
        return parseMebAjaxResponse(json, ajaxUrl);
      });
  }

  function loadList(url, box, source){
    var opts = source || {};

    if(opts.originHost === 'meb.gov.tr'){
      var mebAjaxUrl = null, mebKategori = null;
      if(url === opts.duyurular && opts.duyurularAjax){
        mebAjaxUrl = opts.duyurularAjax; mebKategori = opts.duyurularKategori;
      } else if(url === opts.haberler && opts.haberlerAjax){
        mebAjaxUrl = opts.haberlerAjax; mebKategori = opts.haberlerKategori;
      }
      if(mebAjaxUrl){
        return fetchMebAjaxList(mebAjaxUrl, mebKategori)
          .then(function(items){
            if(items.length === 0) throw new Error('empty-meb-ajax');
            renderItems(box, items);
          })
          .catch(function(){
            // AJAX uç noktası da başarısız olursa eski reader/regex yoluna düş.
            return loadListViaReader(url, box, opts);
          });
      }
    }

    return loadListViaReader(url, box, opts);
  }

  function loadListViaReader(url, box, opts){
    // meb.gov.tr'de "table.icerik-listesi" seçicisi, sayfanın başka bir
    // yerindeki (ör. kenar çubuğu/hızlı erişim) aynı CSS class'ını taşıyan
    // ama duyuru/haberle ilgisi olmayan bir tabloyla da eşleşebiliyor —
    // asıl liste zaten hep JS/AJAX ile geldiğinden bu ham tarama meb için
    // hiçbir zaman doğru veri getirmez, o yüzden meb'de bu adımı atlayıp
    // doğrudan reader (r.jina.ai) adımına geçiyoruz.
    var tableStep = (opts.originHost === 'meb.gov.tr')
      ? Promise.reject(new Error('skip-table-scrape-for-meb'))
      : fetchTableRows(url);

    return tableStep
      .then(function(items){
        if(items.length === 0) throw new Error('empty-table');
        renderItems(box, items);
      })
      .catch(function(){
        return fetchWithTimeout('https://r.jina.ai/' + url, 6000)
          .then(function(res){
            if(!res.ok) throw new Error('reader-failed');
            return res.text();
          })
          .then(function(text){
            var items = extractItems(text, url, opts);
            if(items.length === 0) throw new Error('empty-reader');
            renderItems(box, items);
          });
      })
      .catch(function(){
        showFallback(box, url);
      });
  }

  // Fetches the raw page HTML through a CORS proxy and reads the
  // #icerik-listesi table directly — the exact list markup the site uses.
  // NOTE: this table is populated client-side by DataTables/AJAX after the
  // page loads, so a raw (non-JS) fetch of the page only ever contains the
  // empty header placeholder row. This method will almost always fall
  // through to the reader step below for this site; it's kept first because
  // it's cheap and works for any site that renders its list server-side.
  function fetchTableRows(url){
    return fetchWithTimeout('https://corsproxy.io/?url=' + encodeURIComponent(url), 5000)
      .then(function(res){
        if(!res.ok) throw new Error('proxy-failed');
        return res.text();
      })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var rows = doc.querySelectorAll('#icerik-listesi tbody tr, table.icerik-listesi tbody tr');
        var items = [];
        rows.forEach(function(tr){
          var tds = tr.querySelectorAll('td');
          if(tds.length < 2) return;
          var date = tds[0].textContent.replace(/\s+/g,' ').trim();
          var a = tds[1].querySelector('a[href]');
          if(!a) return;
          var title = a.textContent.replace(/\s+/g,' ').trim();
          if(title.length < 2) return;
          var full;
          try { full = new URL(a.getAttribute('href'), url).href; } catch(e){ return; }
          items.push({ title: title, url: full, date: date });
        });
        return items;
      });
  }

  function extractItems(text, baseUrl, opts){
    opts = opts || {};
    var origin = new URL(baseUrl).origin;
    var linkPattern = opts.linkPattern || /\/icerikler\//;
    var originHost = opts.originHost || null; // varsa: bu ana alan adı ve alt alan adları kabul edilir
    // Sayfanın geneline (footer/menü/banner) serpiştirilmiş, listeyle ilgisi olmayan
    // ama linkPattern ile de eşleşen sabit linkleri elemek için (ör. meb.gov.tr'de
    // "erisilebilirlik" veya "ts-isoiec-27001" gibi footer duyuruları).
    var excludePattern = opts.excludePattern || null;
    var items = [];
    var seen = {};

    function addItem(rawUrl, rawTitle, date){
      var title = (rawTitle || '').replace(/\s+/g,' ').replace(/^\**|\**$/g,'').trim();
      if(title.length < 4) return;
      var full;
      try { full = new URL(rawUrl, baseUrl).href; } catch(e){ return; }

      if(originHost){
        var host;
        try { host = new URL(full).hostname; } catch(e){ return; }
        if(host !== originHost && host.slice(-(originHost.length + 1)) !== ('.' + originHost)) return;
      } else if(full.indexOf(origin) !== 0){
        return;
      }

      if(!linkPattern.test(full)) return;
      if(excludePattern && excludePattern.test(full)) return;
      if(seen[full]) return;
      seen[full] = true;
      items.push({ title: title, url: full, date: date || '' });
    }

    // Pattern 1: markdown table rows -> | 28/02/2022 | [Title](url) |
    var tableRe = /\|\s*(\d{2}[\/\-]\d{2}[\/\-]\d{4})\s*\|\s*\[([^\]]{3,220})\]\(([^)\s]+)\)/g;
    var m;
    while((m = tableRe.exec(text))){
      addItem(m[3], m[2], m[1]);
    }

    // Pattern 2: plain links, e.g. "- [Title 19-05-2026](url)", with a date in or right after the title
    if(items.length === 0){
      var linkRe = /\[([^\]]{3,220})\]\(([^)\s]+)\)/g;
      var lm;
      while((lm = linkRe.exec(text))){
        var title = lm[1];
        var rawUrl = lm[2];
        var dateInTitle = title.match(/(\d{2}[\/\-]\d{2}[\/\-]\d{4})/);
        var date = '';
        if(dateInTitle){
          date = dateInTitle[1];
          title = title.replace(date, '').trim();
        } else {
          var after = text.slice(lm.index + lm[0].length, lm.index + lm[0].length + 40);
          var am = after.match(/(\d{2}[\/\-]\d{2}[\/\-]\d{4})/);
          if(am) date = am[1];
        }
        addItem(rawUrl, title, date);
      }
    }

    return items;
  }

  // 1 Haziran 2026'dan önceki ilanları listede göstermiyoruz.
  // Tarihi ayrıştırılamayan öğeler (format tanınmazsa) güvenli taraf olarak gösterilir.
  var CUTOFF_DATE = new Date(2026, 5, 1); // ay 0-indeksli: 5 = Haziran

  function parseTRDate(str){
    if(!str) return null;
    var m = str.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})/);
    if(!m) return null;
    var day = parseInt(m[1], 10);
    var month = parseInt(m[2], 10);
    var year = parseInt(m[3], 10);
    var d = new Date(year, month - 1, day);
    return isNaN(d.getTime()) ? null : d;
  }

  function filterByCutoff(items){
    return items.filter(function(item){
      var d = parseTRDate(item.date);
      if(!d) return true; // tarih okunamıyorsa listede kalsın
      return d >= CUTOFF_DATE;
    });
  }

  function renderItems(box, items){
    items = filterByCutoff(items);
    if(items.length === 0){
      box.innerHTML = '<div class="status">Haziran 2026 sonrası içerik bulunamadı.</div>';
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'item-list';
    items.slice(0, 25).forEach(function(item){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = item.url; // kept for right-click / "copy link" / accessibility
      a.addEventListener('click', function(e){
        e.preventDefault();
        openArticle(item);
      });

      var t = document.createElement('span');
      t.className = 'item-title';
      t.textContent = item.title;
      a.appendChild(t);

      if(item.date){
        var d = document.createElement('span');
        d.className = 'item-date';
        d.textContent = item.date;
        a.appendChild(d);
      }

      li.appendChild(a);
      ul.appendChild(li);
    });
    box.innerHTML = '';
    box.appendChild(ul);
  }

  function showFallback(box, url){
    box.innerHTML = '';
    var note = document.createElement('div');
    note.className = 'status';
    note.style.marginBottom = '10px';
    note.textContent = 'Liste doğrudan alınamadı, sayfa aşağıda gösteriliyor.';
    var frame = document.createElement('iframe');
    frame.className = 'fallback-frame';
    frame.src = url;
    box.appendChild(note);
    box.appendChild(frame);
  }
</script>
