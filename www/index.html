<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Okul Duyuru</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:#FAF7F2; color:#726B62;
    font-family:system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  #box{ padding:24px; max-width:320px; }
  #msg{ font-size:14px; line-height:1.5; }
  button{
    margin-top:16px; appearance:none; border:1px solid #1C2321;
    background:transparent; color:#1C2321; font-size:14px; font-weight:500;
    padding:11px 18px; border-radius:3px; cursor:pointer; display:none;
  }
</style>
</head>
<body>
  <div id="box">
    <div id="msg">Yükleniyor…</div>
    <button id="retryBtn" type="button">Tekrar dene</button>
  </div>

<script>
  // Gerçek uygulama burada değil, GitHub Pages'te barınıyor.
  // Bu sayede docs/index.html güncellendiğinde APK'yı yeniden kurmaya
  // gerek kalmadan uygulama otomatik olarak en güncel haliyle açılır.
  var REMOTE_URL = 'https://mevafeyzasavas-byte.github.io/okulduyuru/';

  var msg = document.getElementById('msg');
  var retryBtn = document.getElementById('retryBtn');

  function tryLoad(){
    msg.textContent = 'Yükleniyor…';
    retryBtn.style.display = 'none';

    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 8000);

    fetch(REMOTE_URL, { method: 'HEAD', cache: 'no-store', signal: controller.signal })
      .then(function(){
        clearTimeout(timer);
        window.location.replace(REMOTE_URL);
      })
      .catch(function(){
        clearTimeout(timer);
        // HEAD bazı sunucularda desteklenmeyebilir; doğrudan yönlendirmeyi dene.
        window.location.replace(REMOTE_URL);
      });
  }

  retryBtn.addEventListener('click', tryLoad);

  // İnternet yoksa/yavaşsa kullanıcıya makul bir süre sonra durum göster.
  setTimeout(function(){
    if(document.visibilityState !== 'hidden'){
      msg.textContent = 'Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.';
      retryBtn.style.display = 'inline-block';
    }
  }, 9000);

  tryLoad();
</script>
</body>
</html>
